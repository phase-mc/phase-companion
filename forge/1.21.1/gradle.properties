minecraft_version=1.21.1
java_version=21
# Forge for this game version: https://files.minecraftforge.net/net/minecraftforge/forge/index_1.21.1.html
forge_version=52.1.21
# Versions the jar accepts (mods.toml): any Forge 52 on exactly 1.21.1. Forge 51 (game 1.21) is
